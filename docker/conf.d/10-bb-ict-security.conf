##############################################################################
# Bangladesh Bank ICT Security controls -- credcheck v5.0
#
# Guideline on ICT Security 8.2 / 5.9, Cybersecurity Framework 4.1.2.
# Extension: https://github.com/HexaCluster/credcheck  tag v5.0
#
# Loaded via "include_dir = '/etc/postgresql/conf.d'", appended to
# postgresql.conf.sample in the image, so every cluster initdb'd from this
# image picks the policy up automatically.
#
# To relax a setting for a specific deployment, mount a file that sorts AFTER
# this one (e.g. 20-local-overrides.conf) into /etc/postgresql/conf.d rather
# than editing this file -- last value wins.
#
# IMPORTANT: this policy also applies to POSTGRES_PASSWORD. initdb sets the
# superuser password with an internal "ALTER USER ... PASSWORD", and credcheck
# is loaded by then, so a POSTGRES_PASSWORD that violates the rules below makes
# initdb fail and the container exit. That is deliberate -- the superuser
# password must meet policy too -- but it means weak passwords that worked on
# a stock postgres image will now be rejected with, e.g.:
#     FATAL: password length should match the configured
#            credcheck.password_min_length (11)
##############################################################################

shared_preload_libraries = 'credcheck'

# Clause 11.9.2(i) -- stored credentials must never be plaintext.
password_encryption = scram-sha-256

# 8.2.7 -- minimum length
credcheck.password_min_length = 11

# credcheck v5.0 has NO per-superuser length knob. Its README documents
# password_min_length_su / password_valid_until_su, but neither is implemented
# in the v5.0 source -- Postgres logs "invalid configuration parameter name ...
# removing it" and silently drops them. Do not add them here expecting effect.
# The only superuser control that exists is superuser_nocheck, which EXEMPTS
# superusers; keep it off so they are held to the same floor.
credcheck.superuser_nocheck = off

# 8.2.7 -- "at least 3 of 4 character classes".
# credcheck applies each class as an independent AND, not an N-of-M rule, so
# requiring all four is a compliant superset of "at least 3 of 4".
credcheck.password_min_upper = 1
credcheck.password_min_lower = 1
credcheck.password_min_digit = 1
credcheck.password_min_special = 1

# 8.2.8 -- expiry mandatory, capped at 90 days.
#   password_valid_until = MINIMUM days, and the value auto-applied when the
#                          statement carries no VALID UNTIL clause
#   password_valid_max   = MAXIMUM days
# Both at 90 therefore means an explicit VALID UNTIL must be ~exactly 90 days
# out: a SHORTER (stricter) expiry such as 30 days is rejected with
# "require a VALID UNTIL option with a date older than 90 days".
# Lower password_valid_until to widen the accepted window, at the cost of
# lowering the value auto-applied when the clause is omitted.
credcheck.password_valid_until = 90
credcheck.password_valid_max = 90

# 8.2.6 -- force password change on first login.
# Applies only to roles whose password is set through SQL (CREATE/ALTER ROLE).
# The superuser created by "initdb --pwfile" does not pass through that hook,
# so the container's own POSTGRES_USER is not locked out at startup.
credcheck.password_change_first_login = on

# 8.2.5 / 4.1.2.13 -- lock out after repeated failed logins.
# BB text fixes no exact count; 5 is a placeholder pending org policy sign-off.
# The ban fires ON the 5th failure, not after it.
# WARNING: reset_superuser = off means the superuser can be locked out too. An
# operator or health check retrying a stale password WILL brick admin access
# until someone runs SELECT pg_banned_role_reset('<role>') from an unbanned
# session. Set this to on if that risk is unacceptable for your deployment.
credcheck.max_auth_failure = 5
credcheck.reset_superuser = off

# 5.9.1 -- password must not embed the account name.
#
# DEVIATION, needs sign-off: password_ignore_case is OFF, not on.
# In credcheck v5.0 the upper/lower class rules are skipped entirely when
# ignore_case is set:
#     if (!password_ignore_case && pass_total_upper < password_min_upper)
#     if (!password_ignore_case && pass_total_lower < password_min_lower)
# so ignore_case=on would silently cut 8.2.7 enforcement from 4 classes to 2
# (digit + special only), failing "at least 3 of 4". 8.2.7 is an explicit
# numeric requirement, so it wins.
# RESIDUAL GAP: username-in-password matching is therefore case-SENSITIVE.
# Role "t1" rejects 'Containst1!xyz' but ACCEPTS 'ContainsT1!xyz'.
credcheck.password_contain_username = on
credcheck.password_ignore_case = off

# Password reuse policy. Not explicitly numbered in the BB text --
# flagged as a judgment call for sign-off.
credcheck.password_reuse_history = 5
credcheck.password_reuse_interval = 365

# credcheck.encrypted_password_allowed is deliberately LEFT UNSET (default off).
# Off forces CREATE/ALTER ROLE and \password to submit plaintext so the rules
# above can actually be evaluated. Consequence: any connection that SETS a
# password transmits it in plaintext before the server hashes it to
# SCRAM-SHA-256, so such connections MUST use sslmode=require or stronger.
